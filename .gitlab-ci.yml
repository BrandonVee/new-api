stages:
  - verify
  - build
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
    - when: never

variables:
  TARGET:
    value: all
    options: [all, docs, gateway]
    description: "手动流水线构建范围；生产发布在构建通过后单独点击执行。"
  GOWORK: "off"
  GOMAXPROCS: "2"
  GOFLAGS: "-p=2"
  GOMEMLIMIT: "3GiB"
  NODE_OPTIONS: "--max-old-space-size=3072"
  BUN_INSTALL_CACHE_DIR: "$CI_PROJECT_DIR/.cache/bun"

default:
  tags: [local, arm64, docker]
  interruptible: true
  timeout: 1h

.gateway-changes:
  rules:
    - changes: &gateway_changes
        - .gitlab-ci.yml
        - .gitlab/**/*
        - Dockerfile
        - .dockerignore
        - VERSION
        - LICENSE
        - NOTICE
        - THIRD-PARTY-LICENSES.md
        - go.mod
        - go.sum
        - makefile
        - Makefile
        - "*.go"
        - common/**/*
        - constant/**/*
        - controller/**/*
        - dto/**/*
        - e2e/**/*
        - i18n/**/*
        - logger/**/*
        - middleware/**/*
        - model/**/*
        - oauth/**/*
        - pkg/**/*
        - plugins/**/*
        - relay/**/*
        - relaykit/**/*
        - router/**/*
        - service/**/*
        - setting/**/*
        - tokenkit/**/*
        - types/**/*
        - web/**/*

.docs-changes:
  rules:
    - changes: &docs_changes
        - .gitlab-ci.yml
        - .gitlab/**/*
        - docs-site/**/*
        - docs/openapi/api.json
        - docs/openapi/relay.json
        - .env.example
        - web/public/ai-gateway-logo.png

.gateway-rules:
  rules: &gateway_rules
    - if: '$CI_PIPELINE_SOURCE == "web" && ($TARGET == "all" || $TARGET == "gateway")'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      changes:
        compare_to: "refs/heads/$CI_DEFAULT_BRANCH"
        paths: *gateway_changes
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      when: never
    - changes: *gateway_changes

.docs-rules:
  rules: &docs_rules
    - if: '$CI_PIPELINE_SOURCE == "web" && ($TARGET == "all" || $TARGET == "docs")'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      changes:
        compare_to: "refs/heads/$CI_DEFAULT_BRANCH"
        paths: *docs_changes
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      when: never
    - changes: *docs_changes

verify:deployment:
  stage: verify
  image: python:3.10-slim-bookworm
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - changes:
        - .gitlab-ci.yml
        - .gitlab/**/*
  script:
    - python -m unittest discover -s .gitlab/server -p 'test_*.py' -v
    - bash -n .gitlab/deploy.sh .gitlab/build-gateway.sh .gitlab/server/install.sh

gateway:frontend:
  stage: verify
  image: oven/bun:1.4.0
  rules: *gateway_rules
  cache:
    key:
      prefix: bun-1.4.0-web-arm64
      files: [web/bun.lock]
    paths: [.cache/bun/]
  script:
    - cd web
    - bun install --frozen-lockfile
    - bun run typecheck
    - bun run test --maxWorkers=2
    - VITE_REACT_APP_VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA}" bun run build
  artifacts:
    expire_in: 30 days
    paths: [web/dist/]

gateway:build:
  stage: build
  image: golang:1.26.1-bookworm
  rules: *gateway_rules
  needs:
    - job: gateway:frontend
      artifacts: true
  variables:
    GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
    GOMODCACHE: "$CI_PROJECT_DIR/.cache/go-mod"
    GOEXPERIMENT: greenteagc
  cache:
    key:
      prefix: go-1.26.1-arm64
      files: [go.sum, tokenkit/go.sum]
    paths:
      - .cache/go-mod/
      - .cache/go-build/
  script:
    - go vet ./...
    - go build ./...
    - (cd relaykit && go vet ./... && go build ./...)
    - (cd tokenkit && go vet ./... && go build ./...)
    - make test
    - bash .gitlab/build-gateway.sh
  artifacts:
    expire_in: 30 days
    paths: [dist/gateway.tar.gz]

docs:build:
  stage: verify
  image: oven/bun:1.4.0
  rules: *docs_rules
  cache:
    key:
      prefix: bun-1.4.0-docs-arm64
      files: [docs-site/bun.lock]
    paths: [.cache/bun/]
  script:
    - cd docs-site
    - bun install --frozen-lockfile
    - bun run typecheck
    - bun run build
    - |
      bun -e '
        const e = process.env;
        if (!/^[0-9a-f]{40}$/.test(e.CI_COMMIT_SHA || "")) throw new Error("Missing commit SHA");
        await Bun.write(".vitepress/dist/release.json", JSON.stringify({
          component: "docs", commit: e.CI_COMMIT_SHA,
          version: e.CI_COMMIT_TAG || `${e.CI_COMMIT_REF_SLUG}-${e.CI_COMMIT_SHORT_SHA}`,
          pipeline_id: e.CI_PIPELINE_ID, built_at: new Date().toISOString()
        }, null, 2) + "\n");
      '
    - mkdir -p ../dist
    - tar -czf ../dist/docs.tar.gz -C .vitepress/dist .
  artifacts:
    expire_in: 30 days
    paths: [dist/docs.tar.gz]

.production:
  stage: deploy
  image: alpine:3.22
  interruptible: false
  before_script:
    - apk add --no-cache bash coreutils curl jq openssh-client tar gzip

deploy:gateway:
  extends: .production
  needs:
    - job: gateway:build
      artifacts: true
  resource_group: production-gateway
  environment:
    name: production/gateway
    url: https://token.kaimingenergy.com
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "web" && ($TARGET == "all" || $TARGET == "gateway")'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      changes: *gateway_changes
      when: manual
      allow_failure: true
  script:
    - bash .gitlab/deploy.sh deploy gateway

deploy:docs:
  extends: .production
  needs:
    - job: docs:build
      artifacts: true
  resource_group: production-docs
  environment:
    name: production/docs
    url: https://docs.kaimingenergy.com
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "web" && ($TARGET == "all" || $TARGET == "docs")'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      changes: *docs_changes
      when: manual
      allow_failure: true
  script:
    - bash .gitlab/deploy.sh deploy docs

rollback:gateway:
  extends: .production
  needs: []
  resource_group: production-gateway
  environment:
    name: production/gateway
    url: https://token.kaimingenergy.com
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: true
  script:
    - bash .gitlab/deploy.sh rollback gateway

rollback:docs:
  extends: .production
  needs: []
  resource_group: production-docs
  environment:
    name: production/docs
    url: https://docs.kaimingenergy.com
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: true
  script:
    - bash .gitlab/deploy.sh rollback docs
