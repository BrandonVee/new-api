<svg xmlns="http://www.w3.org/2000/svg" width="420" height="604" viewBox="0 0 420 604" role="img" aria-labelledby="title"><title id="title">首次使用的四个步骤</title><rect width="420" height="604" rx="12" fill="#f3f7f8"/><g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif"><text x="20" y="38" font-size="20" font-weight="600" fill="#173d49">首次使用的四个步骤</text><rect x="16" y="62" width="388" height="112" rx="10" fill="white" stroke="#cedee2"/><circle cx="42" cy="92" r="14" fill="#17647a"/><text x="42" y="98" text-anchor="middle" font-size="16" fill="white">1</text><text x="66" y="99" font-size="19" font-weight="600" fill="#173d49">登录账户</text><text x="32" y="132" font-size="18" fill="#48636b">使用平台地址，确认账号与可用权益</text><path d="M42 177v13m-4-4 4 4 4-4" fill="none" stroke="#17647a" stroke-width="2"/><rect x="16" y="194" width="388" height="112" rx="10" fill="white" stroke="#cedee2"/><circle cx="42" cy="224" r="14" fill="#17647a"/><text x="42" y="230" text-anchor="middle" font-size="16" fill="white">2</text><text x="66" y="231" font-size="19" font-weight="600" fill="#173d49">创建 API 密钥</text><text x="32" y="264" font-size="18" fill="#48636b">为应用设置有效期、预算和模型范围</text><path d="M42 309v13m-4-4 4 4 4-4" fill="none" stroke="#17647a" stroke-width="2"/><rect x="16" y="326" width="388" height="112" rx="10" fill="white" stroke="#cedee2"/><circle cx="42" cy="356" r="14" fill="#17647a"/><text x="42" y="362" text-anchor="middle" font-size="16" fill="white">3</text><text x="66" y="363" font-size="19" font-weight="600" fill="#173d49">配置并发出请求</text><text x="32" y="396" font-size="18" fill="#48636b">填写平台 API 地址、密钥和精确模</text><text x="32" y="421" font-size="18" fill="#48636b">型名</text><path d="M42 441v13m-4-4 4 4 4-4" fill="none" stroke="#17647a" stroke-width="2"/><rect x="16" y="458" width="388" height="112" rx="10" fill="white" stroke="#cedee2"/><circle cx="42" cy="488" r="14" fill="#17647a"/><text x="42" y="494" text-anchor="middle" font-size="16" fill="white">4</text><text x="66" y="495" font-size="19" font-weight="600" fill="#173d49">核对使用记录</text><text x="32" y="528" font-size="18" fill="#48636b">在日志中确认请求、用量和结果</text></g></svg>