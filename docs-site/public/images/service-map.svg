<svg xmlns="http://www.w3.org/2000/svg" width="420" height="604" viewBox="0 0 420 604" role="img" aria-labelledby="title"><title id="title">一次模型调用经过哪些环节</title><rect width="420" height="604" rx="12" fill="#f3f7f8"/><g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif"><text x="20" y="38" font-size="20" font-weight="600" fill="#173d49">一次模型调用经过哪些环节</text><rect x="16" y="62" width="388" height="112" rx="10" fill="white" stroke="#cedee2"/><circle cx="42" cy="92" r="14" fill="#17647a"/><text x="42" y="98" text-anchor="middle" font-size="16" fill="white">1</text><text x="66" y="99" font-size="19" font-weight="600" fill="#173d49">用户与应用</text><text x="32" y="132" font-size="18" fill="#48636b">使用自己的 API 密钥发起请求</text><path d="M42 177v13m-4-4 4 4 4-4" fill="none" stroke="#17647a" stroke-width="2"/><rect x="16" y="194" width="388" height="112" rx="10" fill="white" stroke="#cedee2"/><circle cx="42" cy="224" r="14" fill="#17647a"/><text x="42" y="230" text-anchor="middle" font-size="16" fill="white">2</text><text x="66" y="231" font-size="19" font-weight="600" fill="#173d49">开明能源 Token 中转站</text><text x="32" y="264" font-size="18" fill="#48636b">校验访问权限，选择匹配的分组、模型和</text><text x="32" y="289" font-size="18" fill="#48636b">渠道</text><path d="M42 309v13m-4-4 4 4 4-4" fill="none" stroke="#17647a" stroke-width="2"/><rect x="16" y="326" width="388" height="112" rx="10" fill="white" stroke="#cedee2"/><circle cx="42" cy="356" r="14" fill="#17647a"/><text x="42" y="362" text-anchor="middle" font-size="16" fill="white">3</text><text x="66" y="363" font-size="19" font-weight="600" fill="#173d49">上游模型服务</text><text x="32" y="396" font-size="18" fill="#48636b">按实际支持的协议与能力处理请求</text><path d="M42 441v13m-4-4 4 4 4-4" fill="none" stroke="#17647a" stroke-width="2"/><rect x="16" y="458" width="388" height="112" rx="10" fill="white" stroke="#cedee2"/><circle cx="42" cy="488" r="14" fill="#17647a"/><text x="42" y="494" text-anchor="middle" font-size="16" fill="white">4</text><text x="66" y="495" font-size="19" font-weight="600" fill="#173d49">结果与记录</text><text x="32" y="528" font-size="18" fill="#48636b">返回内容，记录请求状态和最终用量</text></g></svg>