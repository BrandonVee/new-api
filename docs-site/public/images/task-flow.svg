<svg xmlns="http://www.w3.org/2000/svg" width="420" height="604" viewBox="0 0 420 604" role="img" aria-labelledby="title"><title id="title">异步任务的处理流程</title><rect width="420" height="604" rx="12" fill="#f3f7f8"/><g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif"><text x="20" y="38" font-size="20" font-weight="600" fill="#173d49">异步任务的处理流程</text><rect x="16" y="62" width="388" height="112" rx="10" fill="white" stroke="#cedee2"/><circle cx="42" cy="92" r="14" fill="#17647a"/><text x="42" y="98" text-anchor="middle" font-size="16" fill="white">1</text><text x="66" y="99" font-size="19" font-weight="600" fill="#173d49">提交任务</text><text x="32" y="132" font-size="18" fill="#48636b">保存网关返回的任务 ID</text><path d="M42 177v13m-4-4 4 4 4-4" fill="none" stroke="#17647a" stroke-width="2"/><rect x="16" y="194" width="388" height="112" rx="10" fill="white" stroke="#cedee2"/><circle cx="42" cy="224" r="14" fill="#17647a"/><text x="42" y="230" text-anchor="middle" font-size="16" fill="white">2</text><text x="66" y="231" font-size="19" font-weight="600" fill="#173d49">查询状态</text><text x="32" y="264" font-size="18" fill="#48636b">排队或执行中：等待后继续查询</text><path d="M42 309v13m-4-4 4 4 4-4" fill="none" stroke="#17647a" stroke-width="2"/><rect x="16" y="326" width="388" height="112" rx="10" fill="white" stroke="#cedee2"/><circle cx="42" cy="356" r="14" fill="#17647a"/><text x="42" y="362" text-anchor="middle" font-size="16" fill="white">3</text><text x="66" y="363" font-size="19" font-weight="600" fill="#173d49">读取终态</text><text x="32" y="396" font-size="18" fill="#48636b">成功：获取产物；失败：查看原因</text><path d="M42 441v13m-4-4 4 4 4-4" fill="none" stroke="#17647a" stroke-width="2"/><rect x="16" y="458" width="388" height="112" rx="10" fill="white" stroke="#cedee2"/><circle cx="42" cy="488" r="14" fill="#17647a"/><text x="42" y="494" text-anchor="middle" font-size="16" fill="white">4</text><text x="66" y="495" font-size="19" font-weight="600" fill="#173d49">核对记录</text><text x="32" y="528" font-size="18" fill="#48636b">确认最终用量，避免状态未知时重复提交</text></g></svg>